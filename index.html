<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroMonitor — Bacia do Guaíba</title>
  <meta name="description" content="Monitoramento em tempo real do nível dos rios da Bacia do Guaíba — 12 estações, dados oficiais ANA/SGB">
  <meta name="theme-color" content="#080f1a">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.1.0/dist/chartjs-plugin-annotation.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content glass">
        <div class="header-brand">
          <div class="header-icon-wrap">
            <i class="fas fa-water header-icon"></i>
          </div>
          <div class="header-text">
            <div class="header-title">Hydro<span>Monitor</span></div>
            <div class="header-sub">Bacia do Jacuí · RS</div>
          </div>
        </div>
        <span class="header-badge"><i class="fas fa-database"></i> 12 estações</span>
      </div>
    </header>

    <main class="main">
      <section class="carousel-section">
        <button class="carousel-btn carousel-btn--left glass" id="carouselPrev" aria-label="Anterior">
          <i class="fas fa-chevron-left"></i>
        </button>

        <div class="carousel" id="carousel">
          <!-- Cards gerados pelo JS -->
        </div>

        <button class="carousel-btn carousel-btn--right glass" id="carouselNext" aria-label="Próximo">
          <i class="fas fa-chevron-right"></i>
        </button>
      </section>

      <section class="detail-section" id="detailSection">
          <div class="detail-card glass">
          <div class="detail-header">
            <span class="detail-location" id="detailLocation">--</span>
            <span class="detail-river" id="detailRiver">--</span>
          </div>

          <div class="detail-level">
            <span class="detail-level-value" id="detailLevelValue">--</span>
            <span class="detail-level-unit">m</span>
          </div>

          <div class="detail-tendencia" id="detailTendencia">
            <span class="trend-stable"><i class="fas fa-minus"></i> Aguardando dados</span>
          </div>

          <div class="detail-status">
            <span class="status-badge" id="statusBadge">--</span>
            <span class="status-cota" id="statusCota">--</span>
          </div>

          <div class="detail-meta">
            <div class="meta-item">
              <i class="far fa-clock"></i>
              <span>Medição: <strong id="detailMedicao">--</strong></span>
            </div>
          </div>

          <div class="detail-cota">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Cota de inundação: <strong id="detailCotaValor">--</strong></span>
          </div>

          <div class="detail-clima" id="detailClima"></div>
        </div>
      </section>

      <section class="chart-section glass">
        <div class="chart-header">
          <h2><i class="fas fa-chart-line"></i> Histórico do Nível</h2>
          <div class="chart-filters" id="chartFilters">
            <button class="filter-btn glass active" data-range="1">24h</button>
            <button class="filter-btn glass" data-range="7">7d</button>
            <button class="filter-btn glass" data-range="0">Tudo</button>
          </div>
        </div>
        <div class="chart-stats" id="chartStats"></div>
        <div class="chart-wrapper">
          <canvas id="chart"></canvas>
          <div class="chart-loading" id="chartLoading">
            <div class="wave-loader"></div>
            <span>Carregando dados...</span>
          </div>
        </div>
      </section>

      <section class="live-section glass">
        <div class="chart-header">
          <h2><i class="fas fa-video"></i> Câmera ao vivo Rio Guaíba/Porto Alegre</h2>
        </div>
        <div class="live-wrapper">
          <iframe id="liveIframe" allow="autoplay; encrypted-media" allowfullscreen loading="lazy" tabindex="-1"></iframe>
          <div class="live-overlay" id="liveOverlay">
            <div class="wave-loader"></div>
          </div>
        </div>
      </section>

      <div class="toast-container" id="toastContainer"></div>
    </main>

    <footer class="footer">
      <p>HydroMonitor v3.0</p>
    </footer>
  </div>

  <script type="module" src="js/app.js?cb=4"></script>
</body>
</html>
