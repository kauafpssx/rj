name: Auto Update!

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  fetch_data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: echo 'TZ=America/Sao_Paulo' >> $GITHUB_ENV
      - run: npm install
        working-directory: cron
      - run: node index.js
        working-directory: cron
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
